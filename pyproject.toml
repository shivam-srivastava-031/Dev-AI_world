[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiciv"
version = "0.1.0"
description = "AI Civilization - a finite world for studying cumulative knowledge in AI agents"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "orjson==3.11.9",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
llm = ["ollama"]
dev = ["pytest==9.0.3"]

[project.scripts]
aiciv = "aiciv.cli:main"

[tool.setuptools.packages.find]
include = ["aiciv*"]

[tool.setuptools.package-data]
aiciv = ["language/*.txt", "persistence/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/nightly"]
filterwarnings = ["error::RuntimeWarning"]
